name: Feature Request
description: Propose a new feature, idea, or generator category
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make Telegram Username Hunter better? Let us know below!
  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: Is your feature request related to a problem or limitation?
      placeholder: I'm always looking for usernames in the gaming niche, but...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Feature / Solution
      description: Describe what you would like to see added or changed.
      placeholder: Add a dedicated 'Gaming & Esports' dictionary generator category...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've looked into?
